name: Auto Update Changelog

on:
  push:
    branches:
      - main
      - feature
      - patch

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get current version
      id: get_version
      run: |
        VERSION=$(grep -oP '(?<=\[v)[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n 1 || echo "0.0.0")
        echo "current=$VERSION" >> $GITHUB_OUTPUT

    - name: Increment version
      id: bump_version
      run: |
        IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.get_version.outputs.current }}"
        BRANCH=$(git rev-parse --abbrev-ref HEAD)

        if [[ "$BRANCH" == "main" ]]; then
          MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
        elif [[ "$BRANCH" == "feature" ]]; then
          MINOR=$((MINOR + 1)); PATCH=0
        elif [[ "$BRANCH" == "patch" ]]; then
          PATCH=$((PATCH + 1))
        fi

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Update CHANGELOG.md
      run: |
        AUTHOR=$(git log -1 --pretty=format:'%an')
        COMMIT_MSG=$(git log -1 --pretty=format:'%s')
        DATE=$(date '+%Y-%m-%d %H:%M:%S')
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        VERSION="v${{ steps.bump_version.outputs.version }}"

        echo -e "### [$VERSION] - $DATE\n- **Author**: $AUTHOR\n- **Branch**: $BRANCH\n- **Message**: $COMMIT_MSG\n" | cat - CHANGELOG.md > temp && mv temp CHANGELOG.md

    - name: Commit and push changelog
      run: |
        git add CHANGELOG.md
        git commit -m "chore: update changelog for ${{ steps.bump_version.outputs.version }}"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}